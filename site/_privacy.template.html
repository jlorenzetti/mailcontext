<!--
  Layout for /privacy. Filled by scripts/build-site.py from docs/privacy.md.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy policy — MailContext</title>
    <meta
      name="description"
      content="MailContext privacy policy. Local-first: no account, backend, analytics, or advertising."
    />
    <link rel="canonical" href="https://mailcontext.com/privacy/" />
    <meta name="theme-color" content="#1E3A4C" />
    <meta property="og:site_name" content="MailContext" />
    <meta property="og:title" content="Privacy policy — MailContext" />
    <meta
      property="og:description"
      content="MailContext privacy policy. Local-first: no account, backend, analytics, or advertising."
    />
    <meta property="og:url" content="https://mailcontext.com/privacy/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://mailcontext.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MailContext — Email, copied right."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privacy policy — MailContext" />
    <meta
      name="twitter:description"
      content="MailContext privacy policy. Local-first: no account, backend, analytics, or advertising."
    />
    <meta name="twitter:image" content="https://mailcontext.com/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="/">
          <img src="/favicon.svg" width="28" height="28" alt="" />
          MailContext
        </a>
        <nav class="nav" aria-label="Site">
          <a href="https://github.com/jlorenzetti/mailcontext">GitHub</a>
          <a href="/privacy/">Privacy</a>
        </nav>
      </header>

      <main>
        <h1 class="page-title">Privacy policy</h1>
        <article class="prose">
          {{content}}
        </article>
      </main>

      <footer class="foot">
        <p>Free and open source · MIT</p>
        <p>
          <a href="/privacy/">Privacy</a>
          ·
          <a href="https://github.com/jlorenzetti/mailcontext">GitHub</a>
        </p>
      </footer>
    </div>
  </body>
</html>
