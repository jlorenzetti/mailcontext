<!--
  Layout for /privacy. Filled by scripts/build-site.py from docs/privacy.md.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy policy — MailContext</title>
    <meta
      name="description"
      content="MailContext privacy policy. Local-first: no account, backend, analytics, or advertising."
    />
    <link rel="canonical" href="https://mailcontext.com/privacy/" />
    <meta name="theme-color" content="#1E3A4C" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="/">
          <img src="/favicon.svg" width="28" height="28" alt="" />
          MailContext
        </a>
        <nav class="nav" aria-label="Site">
          <a href="https://github.com/jlorenzetti/mailcontext">GitHub</a>
          <a href="/privacy/">Privacy</a>
        </nav>
      </header>

      <main>
        <h1 class="page-title">Privacy policy</h1>
        <article class="prose">
          {{content}}
        </article>
      </main>

      <footer class="foot">
        <p>Free and open source · MIT</p>
        <p>
          <a href="/privacy/">Privacy</a>
          ·
          <a href="https://github.com/jlorenzetti/mailcontext">GitHub</a>
        </p>
      </footer>
    </div>
  </body>
</html>
