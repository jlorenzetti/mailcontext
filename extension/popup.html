<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MailContext</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1e3a4c;
        --muted: #5f6368;
        --bg: #f4f7f8;
      }
      body {
        margin: 0;
        padding: 14px 16px 16px;
        width: 280px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 650;
      }
      p {
        margin: 0 0 10px;
        color: var(--muted);
      }
      ol {
        margin: 0;
        padding-left: 1.2em;
      }
      li {
        margin: 0 0 6px;
      }
      code {
        font-size: 12px;
      }
      a {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <h1>MailContext</h1>
    <p>Email, copied right.</p>
    <ol>
      <li>Open a Gmail conversation</li>
      <li>Thread More (⋮) → <strong>Copy thread</strong></li>
      <li>Message More (⋮) → <strong>Copy message</strong></li>
      <li>
        Or <code>Alt+Shift+T</code> / <code>M</code>
        (on macOS, Alt is Option)
      </li>
    </ol>
    <p>
      <a href="https://github.com/jlorenzetti/mailcontext" target="_blank" rel="noopener"
        >GitHub</a
      >
      ·
      <a
        href="https://mailcontext.com/privacy"
        target="_blank"
        rel="noopener"
        >Privacy</a
      >
    </p>
  </body>
</html>
